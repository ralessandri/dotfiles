# ============================================================================
# General settings
# ============================================================================

set -g base-index 1              # start window numbering at 1 (0 is hard to reach)
set -g pane-base-index 1         # start pane numbering at 1, consistent with windows
set -g renumber-windows on       # close gaps in window numbers when a window is closed
set -g history-limit 50000       # increase scrollback buffer (default is only 2000)
set -sg escape-time 10           # reduce delay after prefix/escape (important for non-modifier prefix)
set -g mouse on                  # enable mouse support (click to select pane/window, resize, scroll)

# ============================================================================
# Prefix key
# ============================================================================
# Using § as primary prefix (Swiss German keyboard) and ` as secondary prefix.

unbind C-b
set -g prefix C-a
bind C-a send-prefix
#set -g prefix2 `
#bind § send-prefix
#bind ` send-prefix -2

# ============================================================================
# Key bindings: general
# ============================================================================

# Reload config file
unbind r
bind r source-file ~/.tmux.conf \; display-message 'Reloaded!'

# Paste from tmux buffer
unbind-key ']'
bind-key p paste-buffer

# ============================================================================
# Key bindings: splits & windows
# ============================================================================
# Open new panes/windows in the current pane's working directory instead of $HOME.

bind h split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"
bind -n C-S-Right split-window -h -c "#{pane_current_path}"
bind -n C-S-Down split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind -n C-S-Enter resize-pane -Z
# ============================================================================
# Key bindings: pane navigation & resizing
# ============================================================================

# Navigate panes with Alt + arrow keys (no prefix needed)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Resize panes with Alt + Shift + arrow keys (repeatable, no prefix needed)
bind -r -n M-S-Left  resize-pane -L 5
bind -r -n M-S-Right resize-pane -R 5
bind -r -n M-S-Up    resize-pane -U 5
bind -r -n M-S-Down  resize-pane -D 5

# ============================================================================
# Key bindings: pane swapping
# ============================================================================
# Bound with prefix (not -n) to avoid conflicts with GNOME/Fedora workspace
# shortcuts (Ctrl+Alt+Arrow is reserved globally for workspace switching).

# Swap pane content with adjacent pane (up/down in pane order)
bind Up   swap-pane -U
bind Down swap-pane -D

# Swap current pane into the main (first) position
bind Left swap-pane -t 1

# ============================================================================
# Key bindings: window navigation
# ============================================================================

# Switch windows with Shift + arrow keys (no prefix needed)
bind -n S-Left  previous-window
bind -n S-Right next-window

# ============================================================================
# Copy mode
# ============================================================================

bind Enter copy-mode              # enter copy-mode with prefix + Enter
setw -g mode-keys vi              # use vi-style keys in copy-mode

# Copy selection to system clipboard via wl-copy (Wayland) and exit copy-mode
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# ============================================================================
# Appearance
# ============================================================================

set -g pane-border-lines simple
set -as terminal-features ",*:RGB"

# ============================================================================
# Plugins
# ============================================================================

# tokyo-night-tmux theme configuration
set -g @tokyo-night-tmux_show_path 1
set -g @tokyo-night-tmux_show_datetime 0
set -g @tokyo-night-tmux_path_format relative
set -g @tokyo-night-tmux_window_id_style digital
set -g @tokyo-night-tmux_pane_id_style hsquare
set -g @tokyo-night-tmux_zoom_id_style dsquare
set -g @tokyo-night-tmux_show_git 0

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin "janoamaral/tokyo-night-tmux"
set -g @plugin 'tmux-plugins/tmux-sensible'

# Initialize TPM (must be the last line in the file)
run '~/.tmux/plugins/tpm/tpm'
