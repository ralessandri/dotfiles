onboarding = false

[ui]
sidebar_start_collapsed = false
sidebar_collapsed_mode = "compact"

show_agent_labels_on_pane_borders = true

agent_panel_sort = "priority"
[keys]
prefix = "ctrl+a"
split_vertical   = ["prefix+h", "ctrl+shift+right"]
split_horizontal = ["prefix+v", "ctrl+shift+down"]
close_pane = ["prefix+x", "ctrl+shift+left"]

new_tab = "prefix+c"

focus_pane_left  = "alt+left"
focus_pane_right = "alt+right"
focus_pane_up    = "alt+up"
focus_pane_down  = "alt+down"

[remote]
manage_ssh_config = false

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "80%"
height = "80%"
