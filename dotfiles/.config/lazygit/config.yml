gui:
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - blue
      - bold
    inactiveBorderColor:
      - default
    searchingActiveBorderColor:
      - blue
      - bold
    optionsTextColor:
      - blue
    selectedLineBgColor:
      - black
    inactiveViewSelectedLineBgColor:
      - black
    cherryPickedCommitFgColor:
      - blue
    cherryPickedCommitBgColor:
      - black
    markedBaseCommitFgColor:
      - blue
    markedBaseCommitBgColor:
      - black
    unstagedChangesColor:
      - red
    defaultFgColor:
      - default

  authorColors:
    "*": blue
customCommands:
  - key: "<c-g>"
    context: "files"
    description: "AI commit message"
    command: '~/.local/bin/ai-commit.sh -p "$(git rev-parse --show-toplevel)" -m ""'
    loadingText: "Generate commit message..."
    output: terminal
