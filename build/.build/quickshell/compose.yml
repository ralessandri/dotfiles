services:
  quickshell-build:
    image: fedora:44
    working_dir: /build
    environment:
      HOST_UID: "${HOST_UID:-1000}"
      HOST_GID: "${HOST_GID:-1000}"
    volumes:
      - .:/out
    command:
      - /bin/bash
      - -c
      - |
        set -euxo pipefail

        dnf upgrade -y

        dnf install -y \
          dnf-plugins-core \
          rpm-build

        dnf copr enable -y avengemedia/danklinux

        dnf download --source quickshell

        dnf builddep -y quickshell-*.src.rpm

        rpmbuild --rebuild quickshell-*.src.rpm

        find /root/rpmbuild/RPMS \
          -type f \
          -name 'quickshell-*.rpm' \
          ! -name 'quickshell-debuginfo-*' \
          ! -name 'quickshell-debugsource-*' \
          -exec cp -fv {} /out/ \;

        chown "$HOST_UID:$HOST_GID" /out/quickshell-*.rpm
